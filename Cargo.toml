[package]
name = "kanidm_sshkey_fetcher"
description = "Fetch SSH keys for multiple users from a Kanidm server"
version = "0.1.0"
authors = ["duskmoon (Campbell He) <kp.campbell.he@duskmoon314.com>"]
edition = "2024"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
humantime = "2.3"
humantime-serde = "1.1.1"
kanidm_client = "1.10.0"
kanidm_proto = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
shellexpand = "3.1.2"
tokio = { version = "1.52.3", features = ["rt"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
